[env:test]
platform = espressif32
board = lolin_c3_mini
framework = arduino
lib_deps =
    iotrains=file://../lib/iotrains
build_unflags = -std=gnu++11
build_flags = -DESP32 -std=c++2a -O3 -s -DAUDIO_I2S -D NAME="test"
board_build.flash_mode = dio
monitor_speed = 115200
extra_scripts=set_build_flags_32.py
board_build.partitions = esp32c3partition.csv
;https://github.com/espressif/arduino-esp32/blob/master/tools/partitions/default.csv?plain=1

[env:test_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    iotrains=file://../lib/iotrains
    ; pin arduino-audio-tools to the pre-refactor commit (headers under src/AudioCodecs/*)
    arduino-audio-tools=https://github.com/pschatzmann/arduino-audio-tools.git
    tlc5940
build_unflags = -std=gnu++11
build_flags =
    -DESP32 -DESP32S3 -std=c++2a -O3 -s -DAUDIO_I2S -D NAME=\"test_s3\"
    ; route Arduino's Serial to the native USB-Serial-JTAG (GPIO19/20)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
monitor_speed = 115200
; flash & monitor over the chip's built-in USB-Serial-JTAG
upload_protocol = esptool
monitor_rts = 0
monitor_dtr = 0
extra_scripts = set_build_flags_32.py
board_build.partitions = esp32s3partition.csv

